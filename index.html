Experiment 2: GUI Checkpoint for Single Property (Title/Text/Attribute)
Tools/Requirements:
• Selenium WebDriver (Java)
• TestNG or JUnit (recommended)
Procedure:
1. Create a new Java class in package com.test.selenium (e.g., Exp2_SinglePropertyCheckpoint).
2. Launch the browser using Selenium WebDriver and open the target URL.
3. Choose one GUI property to verify (page title OR element text OR an attribute).
4. Capture the actual value (driver.getTitle() / element.getText() / element.getAttribute()).
5. Compare with expected value using assertion (TestNG/JUnit) or if-else logic.
6. Print PASS/FAIL in the console.
7. Close the browser.
Notes:
• Use WebDriverWait if the page/property loads slowly.
Sample Java Code:
// Exp 2: Single Property Checkpoint (Page Title)
package com.test.selenium;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.chrome.ChromeDriver;
public class Exp2_SinglePropertyCheckpoint {
 public static void main(String[] args) throws InterruptedException {
 WebDriver driver = new ChromeDriver();
 driver.get("https://www.google.com");
 String expectedTitle = "Google";
 String actualTitle = driver.getTitle();
 System.out.println("Actual Title : " + actualTitle);
 System.out.println("Expected Title : " + expectedTitle);
 if (actualTitle.equals(expectedTitle)) {
 System.out.println("PASS: Title is correct");
 } else {
 System.out.println("FAIL: Title is incorrect");
 }
 Thread.sleep(2000);
 driver.quit();
 }
}

JSX (JavaScript XML) allows writing HTML-like syntax within JavaScript. React uses a Virtual DOM to 
efficiently update only the changed parts of the user interface, improving performance.
Algorithm
1. Create a React application. 
2. Create a state variable using useState. 
3. Display the state value using JSX. 
4. Add a button to update the state. 
5. Observe the UI update through Virtual DOM.

 2. Product Listing Page Using React Components
Aim
1. To create reusable React components. 
2. To display product information using props. 
3. To understand component-based architecture in React. 
4. To implement event handling using buttons. 
Software Requirements
• Windows 10/11 
• Node.js 
• React.js 
• Visual Studio Code 
• Google Chrome
Theory
React applications are built using components, which are reusable blocks of code. Components help 
organize the user interface and improve code reusability.
Props (Properties) are used to pass data from a parent component to a child component. In this 
experiment, product details such as name, price, and category are passed from the App component 
to the ProductCard component using props.
The map() function is used to display multiple products dynamically from an array. When the Buy 
Now button is clicked, an alert message is displayed.
Algorithm
1. Create a React application. 
2. Create a ProductCard component. 
3. Store product details in an array. 
4. Pass product data as props to the ProductCard component. 
5. Use the map() function to display all products. 
6. Add a Buy Now button. 
7. Display an alert message when the button is clicked.

Installation Procedure:
The setup process is identical to previous React experiments. A React project is created using 
Vite, dependencies are installed using npm, and the application is executed using the Vite 
development server. React Hooks(useState, useEffect, etc.) are included in React by default 
and require no additional installation.
Aim
To create a product listing page using multiple stateless React components and demonstrate 
the use of props for passing data and handling user interactions.
Software Requirements
• Node.js

Theory
React Hooks enable functional components to manage state and lifecycle features without 
using classes.
• useState manages component state.
• useEffect handles side effects such as Dom updates.
• useMemo optimizes performance by memorizing computed values.
• useRef provides direct access to DOM elements.
• useContext allows data sharing across components without prop drilling.

//App.jsx

import React, { useState, useMemo } from "react";

export default function App() {

  const [products] = useState([
    { name: "Pen", qty: 10, price: 20 },
    { name: "Book", qty: 5, price: 100 }
  ]);

  const [search, setSearch] = useState("");

  const [dark, setDark] = useState(false);


  const totalValue = useMemo(() => {

    return products.reduce(
      (sum, item) => sum + item.qty * item.price,
      0
    );

  }, [products]);


  const filtered = products.filter((p) =>
    p.name.toLowerCase().includes(search.toLowerCase())
  );


  return (

    <div
      style={{
        backgroundColor: dark ? "#222" : "#fff",
        color: dark ? "#fff" : "#000",
        minHeight: "100vh",
        padding: "20px"
      }}
    >

      <h2>Inventory Management</h2>


      <button onClick={() => setDark(!dark)}>
        Toggle Theme
      </button>


      <br /><br />


      <input
        type="text"
        placeholder="Search Product"
        value={search}
        onChange={(e) => setSearch(e.target.value)}
      />


      <ul>

        {
          filtered.map((p, index) => (

            <li key={index}>
              {p.name} - Qty: {p.qty} - ₹{p.price}
            </li>

          ))
        }

      </ul>


      <h3>
        Total Value: ₹{totalValue}
      </h3>


    </div>

  );
}
