import java.awt.image.*;

public class p4 {
    public static void main(String[] args) throws Exception {
        JFrame f = new JFrame();
        JTextField t = new JTextField("Search");
        f.add(t);
        f.setSize(300, 100);

        BufferedImage img = new BufferedImage(t.getWidth(), t.getHeight(), 1);
        t.paint(img.getGraphics());
        File b = new File("base.png");
        ImageIO.write(img, "png", new File("current.png"));
        if (!b.exists()) {
            ImageIO.write(img, "png", b);
            System.out.println("Baseline created");
        } else {
            BufferedImage old = ImageIO.read(b);
            boolean pass = true;
            for (int x = 0; x < img.getWidth(); x++)
                for (int y = 0; y < img.getHeight(); y++)
                    if (img.getRGB(x,y) != old.getRGB(x,y))
                        pass = false;
            System.out.println(pass ? "PASS" : "FAIL");
        }
        f.dispose();
    }
}
  import java.awt.image.*;
import java.io.*;
import javax.imageio.*;
import javax.swing.*;

public class p4b {

    public static void main(String[] args) throws Exception {

        JFrame f = new JFrame("Google");

        JPanel p = new JPanel();
        p.add(new JLabel("Google"));
        p.add(new JTextField(15));
        p.add(new JButton("Search"));

        f.add(p);
        f.setSize(400, 300);
        f.setVisible(true);

        Thread.sleep(1000);

        BufferedImage img = new BufferedImage(
                f.getWidth(), f.getHeight(), BufferedImage.TYPE_INT_RGB);

        f.paint(img.getGraphics());

        // Crop image
        BufferedImage crop = img.getSubimage(0, 0, 300, 200);

        File b = new File("base.png");

        if (!b.exists()) {

            ImageIO.write(crop, "png", b);
            System.out.println("Baseline created");

        } else {

            BufferedImage old = ImageIO.read(b);

            if (old.getWidth() != crop.getWidth() ||
                    old.getHeight() != crop.getHeight()) {

                System.out.println("FAIL: Different image sizes");

            } else {

                int same = 0;
                int total = crop.getWidth() * crop.getHeight();

                for (int x = 0; x < crop.getWidth(); x++) {
                    for (int y = 0; y < crop.getHeight(); y++) {

                        if (crop.getRGB(x, y) == old.getRGB(x, y))
                            same++;
                    }
                }

                double similarity = (double) same / total * 100;

                System.out.printf("Similarity: %.2f%%%n", similarity);

                System.out.println(
                        similarity >= 95 ? "PASS" : "FAIL");
            }
        }

        f.dispose();
    }
}

import java.sql.*;

public class NewTest {

    public static void main(String[] args) {

        try {
            // Connect to database
            Connection con = DriverManager.getConnection(
                    "jdbc:sqlite:StudentDB.db");

            Statement st = con.createStatement();

            // Create table
            st.execute("CREATE TABLE IF NOT EXISTS STUDENT " +
                    "(ID INTEGER PRIMARY KEY, NAME TEXT, EMAIL TEXT)");

            // Insert record
            st.execute("DELETE FROM STUDENT");

            st.execute("INSERT INTO STUDENT VALUES " +
                    "(1, 'Ajay', 'ajay@gmail.com')");

            // Check record
            ResultSet rs = st.executeQuery(
                    "SELECT * FROM STUDENT WHERE ID=1");

            if (rs.next()) {
                System.out.println("Record Exists");
                System.out.println("ID : " + rs.getInt("ID"));
                System.out.println("Name : " + rs.getString("NAME"));
                System.out.println("Email : " + rs.getString("EMAIL"));
                System.out.println("TEST PASSED");
            } else {
                System.out.println("Record Not Found");
                System.out.println("TEST FAILED");
            }

            con.close();

        } catch (Exception e) {
            System.out.println(e);
        }
    }
}

public class DynamicDataTest {
    static double discount(int price, String category) {
        if (category.equals("electronics"))
            return price * 0.9;
        else if (category.equals("clothing"))
            return price * 0.8;
        else
            return price;
    }

        String[] categories = {"electronics", "clothing", "grocery"};
        Random r = new Random();
        System.out.println("---- Dynamic Test Data Submission ----");

            int price = 100 + r.nextInt(901);
            String category = categories[r.nextInt(3)];
            double result = discount(price, category);
            System.out.println("Test " + i +": price=" + price +", category=" + category +" -> discounted=" + result);

import java.io.*;
public class DataDrivenBatch {
    public static void main(String[] args) throws Exception {
        // Create CSV file
        PrintWriter pw = new PrintWriter("batch_data.csv");
        pw.println("Price,Category,Expected");
        pw.println("500,electronics,450");
        pw.println("300,clothing,240");
        pw.println("150,grocery,150");
        pw.println("1000,electronics,900");
        pw.close();
        // Read CSV file
        BufferedReader br = new BufferedReader(new FileReader("batch_data.csv"));
        String line = br.readLine(); // skip header
        int pass = 0;
        int fail = 0;
        System.out.println("---- Data Driven Batch Test ----");
        while ((line = br.readLine()) != null) {
            String[] data = line.split(",");
            double price = Double.parseDouble(data[0]);
            String category = data[1];
            double expected = Double.parseDouble(data[2]);
            double actual = price;
            if (category.equals("electronics"))
                actual = price * 0.9;
            else if (category.equals("clothing"))
                actual = price * 0.8;
            if (actual == expected) {
                System.out.println("PASS: " + category +
                        ", price=" + price + " -> " + actual);
                pass++;
            } else {
                System.out.println("FAIL: " + category +
                        ", price=" + price +
                        " -> " + actual +
                        ", expected=" + expected);
                fail++;
            }
        }
        br.close();
        System.out.println("\nBatch Summary: " +pass + " Passed, " + fail + " Failed");
    }
}

import java.util.logging.*;
import java.io.*;

public class SilentModeTest {

    static Logger log = Logger.getLogger("Test");

    public static void main(String[] args) throws Exception {

        // Create log file
        log.setUseParentHandlers(false);

        FileHandler file = new FileHandler("silent_test_log.txt");
        file.setFormatter(new SimpleFormatter());
        log.addHandler(file);

        // Tests
        test("Addition", 2 + 2, 4);
        test("Subtraction", 10 - 5, 5);
        test("Multiplication", 3 * 3, 10);
        test("String", "abc".toUpperCase(), "ABC");

        System.out.println(
            "Batch execution completed silently. Check silent_test_log.txt");
    }

    static void test(String name, Object actual, Object expected) {

        if (actual.equals(expected))
            log.info(name + ": PASS");
        else
            log.severe(name + ": FAIL");
    }
}

public class CalculatorTest {

    public static void main(String[] args) throws Exception {

        Robot r = new Robot();
        r.setAutoDelay(200);

        // 7 + 5 =
        r.keyPress(KeyEvent.VK_7);
        r.keyRelease(KeyEvent.VK_7);

        r.keyPress(KeyEvent.VK_ADD);
        r.keyRelease(KeyEvent.VK_ADD);

        r.keyPress(KeyEvent.VK_5);
        r.keyRelease(KeyEvent.VK_5);

        r.keyPress(KeyEvent.VK_EQUALS);
        r.keyRelease(KeyEvent.VK_EQUALS);

        Thread.sleep(1000);

        // Take screenshot
        Rectangle screen = new Rectangle(
                Toolkit.getDefaultToolkit().getScreenSize());

        BufferedImage image = r.createScreenCapture(screen);

        ImageIO.write(image, "png",
                new File("calculator_result.png"));

        System.out.println("Test executed: 7 + 5 = 12");
        System.out.println("Screenshot saved as calculator_result.png");
    }
